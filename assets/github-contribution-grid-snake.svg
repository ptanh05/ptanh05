  <defs>
    <style>
      .s-bg { fill: #ebedf0; rx: 2px; }
      .s-l1 { fill: #9be9a8; rx: 2px; }
      .s-l2 { fill: #40c463; rx: 2px; }
      .s-l3 { fill: #30a14e; rx: 2px; }
      .s-l4 { fill: #216e39; rx: 2px; }
      .snake-head { fill: #4f46e5; }
      .snake-body { fill: #818cf8; }

      @keyframes snake-crawl {
        0% { transform: translate(120px, 40px); }
        25% { transform: translate(340px, 40px); }
        50% { transform: translate(340px, 76px); }
        75% { transform: translate(580px, 76px); }
        100% { transform: translate(720px, 40px); }
      }
      .snake-group {
        animation: snake-crawl 10s ease-in-out infinite alternate;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
