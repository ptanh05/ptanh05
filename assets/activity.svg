<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="act-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0e1524" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c2e" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <pattern id="act-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes dash-move {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      .flow-path {
        stroke-dasharray: 4 4;
        animation: dash-move 1.5s linear infinite;
      }
      .mono-txt {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .sans-txt {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </defs>

  <rect width="920" height="180" rx="8" fill="url(#act-bg)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="920" height="180" rx="8" fill="url(#act-grid)" />

  <!-- Section Header Tag -->
  <g transform="translate(24, 22)">
    <text x="0" y="0" fill="#38bdf8" font-size="10" font-weight="700" class="mono-txt" letter-spacing="1.5">SYSTEM ARCHITECTURE // RECURRENT PIPELINE</text>
    <line x1="285" y1="-3" x2="872" y2="-3" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- 4 Architecture Blocks -->

  <!-- Node 1: Multimodal Sensing and Ingestion -->
  <g transform="translate(24, 42)">
    <rect width="195" height="114" rx="6" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="195" height="4" rx="2" fill="#38bdf8" />
    <text x="14" y="24" fill="#38bdf8" font-size="9" font-weight="700" class="mono-txt">LAYER 01 // INGESTION</text>
    <text x="14" y="44" fill="#f1f5f9" font-size="13" font-weight="700" class="sans-txt">Multimodal Perception</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5" class="mono-txt">• Audio Mel-Spectrograms</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9.5" class="mono-txt">• Lyrics &amp; NLP Embeddings</text>
    <text x="14" y="98" fill="#94a3b8" font-size="9.5" class="mono-txt">• Real-Time IoT Sensors</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line class="flow-path" x1="220" y1="99" x2="248" y2="99" stroke="#38bdf8" stroke-width="1.5" />
  <polygon points="247,96 252,99 247,102" fill="#38bdf8" />

  <!-- Node 2: Uncertainty and Calibration -->
  <g transform="translate(252, 42)">
    <rect width="195" height="114" rx="6" fill="url(#card-grad)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="195" height="4" rx="2" fill="#a78bfa" />
    <text x="14" y="24" fill="#a78bfa" font-size="9" font-weight="700" class="mono-txt">LAYER 02 // RESEARCH</text>
    <text x="14" y="44" fill="#f1f5f9" font-size="13" font-weight="700" class="sans-txt">Reliability &amp; Calibration</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5" class="mono-txt">• Distribution Shift Guard</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9.5" class="mono-txt">• Temperature / ECE Loss</text>
    <text x="14" y="98" fill="#94a3b8" font-size="9.5" class="mono-txt">• Quantum Kernel Modules</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line class="flow-path" x1="448" y1="99" x2="476" y2="99" stroke="#a78bfa" stroke-width="1.5" />
  <polygon points="475,96 480,99 475,102" fill="#a78bfa" />

  <!-- Node 3: Systems and Production Engineering -->
  <g transform="translate(480, 42)">
    <rect width="195" height="114" rx="6" fill="url(#card-grad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="195" height="4" rx="2" fill="#34d399" />
    <text x="14" y="24" fill="#34d399" font-size="9" font-weight="700" class="mono-txt">LAYER 03 // SYSTEMS</text>
    <text x="14" y="44" fill="#f1f5f9" font-size="13" font-weight="700" class="sans-txt">High-Integrity SaaS</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5" class="mono-txt">• Multi-Tenant RBAC</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9.5" class="mono-txt">• Dynamic OTP State Engine</text>
    <text x="14" y="98" fill="#94a3b8" font-size="9.5" class="mono-txt">• Next.js 16 + Neon Postgre</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line class="flow-path" x1="676" y1="99" x2="704" y2="99" stroke="#34d399" stroke-width="1.5" />
  <polygon points="703,96 708,99 703,102" fill="#34d399" />

  <!-- Node 4: Web3 and Settlement -->
  <g transform="translate(708, 42)">
    <rect width="188" height="114" rx="6" fill="url(#card-grad)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="188" height="4" rx="2" fill="#f43f5e" />
    <text x="14" y="24" fill="#f43f5e" font-size="9" font-weight="700" class="mono-txt">LAYER 04 // WEB3</text>
    <text x="14" y="44" fill="#f1f5f9" font-size="13" font-weight="700" class="sans-txt">Decentralized Trust</text>
    <text x="14" y="66" fill="#94a3b8" font-size="9.5" class="mono-txt">• Sui &amp; Aptos Move</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9.5" class="mono-txt">• Tamper-Proof Audit NFT</text>
    <text x="14" y="98" fill="#94a3b8" font-size="9.5" class="mono-txt">• Decentralized Storage</text>
  </g>
</svg>
