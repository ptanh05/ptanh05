<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="100%">
  <defs>
    <!-- Light Mode Background Gradient -->
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Indigo to Purple Accent Gradient -->
    <linearGradient id="purple-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <!-- Subtle Dot Grid Pattern for Light Mode -->
    <pattern id="light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" fill-opacity="0.6" />
    </pattern>

    <!-- Safe CSS Animations -->
    <style>
      @keyframes soft-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes dash-flow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ring-expand {
        0% { r: 6px; opacity: 0.8; stroke-width: 1.5px; }
        100% { r: 16px; opacity: 0; stroke-width: 0.5px; }
      }

      .pulse-core {
        transform-origin: center;
        animation: soft-pulse 3s ease-in-out infinite;
      }
      .flow-signal-1 {
        stroke-dasharray: 4 6;
        animation: dash-flow 2s linear infinite;
      }
      .flow-signal-2 {
        stroke-dasharray: 5 8;
        animation: dash-flow 2.8s linear infinite;
      }
      .pulse-ring {
        animation: ring-expand 2.5s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="920" height="200" rx="12" fill="url(#light-bg)" stroke="#e2e8f0" stroke-width="1.2" />
  <rect width="920" height="200" rx="12" fill="url(#light-grid)" />

  <!-- Subtle Top Accent Line -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 908 0 C 914.63 0 920 5.37 920 12 L 920 3 L 0 3 Z" fill="url(#purple-blue-grad)" />

  <!-- Left Side: Identity and Value Proposition -->
  <g transform="translate(44, 38)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#6366f1" />
      <text x="24" y="16" fill="#4338ca" font-size="11" font-weight="600" class="font-sans">AI &amp; SOFTWARE ENGINEERING</text>
    </g>

    <!-- Headline -->
    <text x="0" y="62" fill="#0f172a" font-size="28" font-weight="800" class="font-sans" letter-spacing="-0.5">
      Hi, I'm Phùng Thế Anh <tspan font-size="26">👋</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="92" fill="url(#purple-blue-grad)" font-size="15" font-weight="700" class="font-sans" letter-spacing="0.3">
      AI Researcher · Software Engineer · Web3 Builder
    </text>

    <!-- Tagline -->
    <text x="0" y="120" fill="#64748b" font-size="13" font-weight="450" class="font-sans">
      Building reliable multimodal AI, scalable software systems, and decentralized applications.
    </text>
  </g>

  <!-- Right Side: Clean Light-Mode Neural Network Graphic -->
  <g transform="translate(620, 25)">
    <!-- Ambient Halo Background -->
    <circle cx="140" cy="75" r="70" fill="url(#node-glow)" />

    <!-- Network Graph Edges (Static Light Gray) -->
    <g stroke="#cbd5e1" stroke-width="1.2">
      <line x1="40" y1="40" x2="110" y2="75" />
      <line x1="40" y1="110" x2="110" y2="75" />
      <line x1="110" y1="75" x2="170" y2="40" />
      <line x1="110" y1="75" x2="170" y2="110" />
      <line x1="170" y1="40" x2="230" y2="75" />
      <line x1="170" y1="110" x2="230" y2="75" />
      <line x1="170" y1="40" x2="170" y2="110" />
    </g>

    <!-- Dynamic Flowing Signals -->
    <g fill="none">
      <line class="flow-signal-1" x1="40" y1="40" x2="110" y2="75" stroke="#6366f1" stroke-width="1.8" />
      <line class="flow-signal-2" x1="40" y1="110" x2="110" y2="75" stroke="#8b5cf6" stroke-width="1.8" />
      <line class="flow-signal-1" x1="110" y1="75" x2="170" y2="40" stroke="#6366f1" stroke-width="2" />
      <line class="flow-signal-2" x1="110" y1="75" x2="170" y2="110" stroke="#a855f7" stroke-width="2" />
      <line class="flow-signal-1" x1="170" y1="40" x2="230" y2="75" stroke="#3b82f6" stroke-width="2" />
    </g>

    <!-- Node 1 (Input A) -->
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
      <circle cx="0" cy="0" r="3.5" fill="#6366f1" />
      <text x="-24" y="-12" fill="#64748b" font-size="9" font-weight="600" class="font-mono">Audio</text>
    </g>

    <!-- Node 2 (Input B) -->
    <g transform="translate(40, 110)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
      <circle cx="0" cy="0" r="3.5" fill="#8b5cf6" />
      <text x="-24" y="20" fill="#64748b" font-size="9" font-weight="600" class="font-mono">Text</text>
    </g>

    <!-- Node 3: Center Fusion Core -->
    <g transform="translate(110, 75)">
      <circle class="pulse-ring" cx="0" cy="0" r="8" fill="none" stroke="#6366f1" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
      <circle class="pulse-core" cx="0" cy="0" r="6" fill="#4f46e5" />
      <text x="-16" y="26" fill="#4f46e5" font-size="9.5" font-weight="700" class="font-sans">Fusion</text>
    </g>

    <!-- Node 4 (Representation 1) -->
    <g transform="translate(170, 40)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
      <circle cx="0" cy="0" r="3.5" fill="#6366f1" />
      <text x="12" y="-4" fill="#64748b" font-size="9" font-weight="600" class="font-mono">Model</text>
    </g>

    <!-- Node 5 (Representation 2) -->
    <g transform="translate(170, 110)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#a855f7" stroke-width="2" />
      <circle cx="0" cy="0" r="3.5" fill="#a855f7" />
      <text x="12" y="16" fill="#64748b" font-size="9" font-weight="600" class="font-mono">Calib</text>
    </g>

    <!-- Node 6: Output / System -->
    <g transform="translate(230, 75)">
      <circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5" />
      <circle cx="0" cy="0" r="4.5" fill="#0ea5e9" />
      <text x="-12" y="24" fill="#0369a1" font-size="9.5" font-weight="700" class="font-sans">System</text>
    </g>
  </g>
</svg>
