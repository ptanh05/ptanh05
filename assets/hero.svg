<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background and Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10" />
      <stop offset="50%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>

    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes flow-data {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flow-data-rev {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 120; }
      }
      @keyframes radar {
        0% { transform: translateY(-40px); opacity: 0; }
        20% { opacity: 0.7; }
        80% { opacity: 0.7; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes node-ring {
        0% { r: 5px; opacity: 0.9; stroke-width: 1.5px; }
        100% { r: 18px; opacity: 0; stroke-width: 0.2px; }
      }

      .pulse-node {
        transform-origin: center;
        animation: pulse-glow 3.5s ease-in-out infinite;
      }
      .signal-line-1 {
        stroke-dasharray: 6 12;
        animation: flow-data 2.2s linear infinite;
      }
      .signal-line-2 {
        stroke-dasharray: 8 16;
        animation: flow-data-rev 3s linear infinite;
      }
      .signal-line-3 {
        stroke-dasharray: 5 10;
        animation: flow-data 2.6s linear infinite;
      }
      .scanner {
        animation: radar 6s ease-in-out infinite;
      }
      .live-dot {
        animation: blink 1.8s infinite;
      }
      .expanding-ring {
        animation: node-ring 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .expanding-ring-delayed {
        animation: node-ring 2.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        animation-delay: 1.4s;
      }

      .tech-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .tech-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="920" height="280" rx="10" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.2" />
  <rect width="920" height="280" rx="10" fill="url(#grid)" />
  <rect width="920" height="280" rx="10" fill="url(#dots)" />

  <!-- Scanning Beam Effect -->
  <rect class="scanner" x="10" y="0" width="900" height="35" fill="url(#radar-sweep)" pointer-events="none" />

  <!-- Corner Brackets (Terminal / Lab aesthetic) -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 904 28 L 904 16 L 892 16" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 16 252 L 16 264 L 28 264" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 904 252 L 904 264 L 892 264" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

  <!-- Technical Top Header Bar -->
  <line x1="30" y1="44" x2="890" y2="44" stroke="#334155" stroke-width="0.8" stroke-dasharray="3 4" />
  
  <g transform="translate(32, 34)">
    <circle class="live-dot" cx="0" cy="0" r="4" fill="#10b981" />
    <circle cx="0" cy="0" r="7" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="3" fill="#10b981" font-size="10.5" font-weight="600" class="tech-mono" letter-spacing="1.5">SYS.STATUS: ONLINE</text>
    <text x="165" y="3" fill="#64748b" font-size="10" class="tech-mono">//</text>
    <text x="180" y="3" fill="#94a3b8" font-size="10.5" class="tech-mono">LOC: HANOI, VN [21.0285°N, 105.8542°E]</text>
    <text x="440" y="3" fill="#64748b" font-size="10" class="tech-mono">//</text>
    <text x="455" y="3" fill="#38bdf8" font-size="10.5" class="tech-mono">ARCH: MULTIMODAL × DISTRIBUTED SYSTEMS</text>
  </g>

  <!-- Left: Main Identity Block -->
  <g transform="translate(42, 85)">
    <!-- Sub-badge -->
    <rect x="0" y="0" width="168" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="8" y="14" fill="#38bdf8" font-size="10" font-weight="700" class="tech-mono" letter-spacing="1.2">PTANH05 // AI LAB</text>

    <!-- Name Headline -->
    <text x="0" y="58" fill="#f8fafc" font-size="34" font-weight="800" class="tech-sans" letter-spacing="-0.5">
      PHÙNG THẾ ANH
    </text>

    <!-- Sub-headline / Core Identity -->
    <text x="1" y="86" fill="#94a3b8" font-size="13" font-weight="600" class="tech-mono" letter-spacing="2">
      AI × RESEARCH × ENGINEERING × WEB3
    </text>

    <!-- Terminal Metadata Ticker -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="450" height="34" rx="4" fill="#0b1324" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="16" fill="#64748b" font-size="9.5" class="tech-mono">PRIMARY INQUIRY</text>
      <text x="14" y="27" fill="#38bdf8" font-size="10.5" font-weight="600" class="tech-mono">Reliable Multimodal Learning under Modality Absence &amp; Shift</text>

      <text x="290" y="16" fill="#64748b" font-size="9.5" class="tech-mono">CORE ENGINE</text>
      <text x="290" y="27" fill="#a78bfa" font-size="10.5" font-weight="600" class="tech-mono">PyTorch · Next.js · Move</text>
    </g>
  </g>

  <!-- Right: Scientific Neural / System Graph Visualization -->
  <g transform="translate(540, 56)">
    <!-- Boundary Box for Graph -->
    <rect x="0" y="0" width="345" height="195" rx="6" fill="#070c16" stroke="#1e293b" stroke-width="1" fill-opacity="0.8" />
    
    <!-- Header of graph monitor -->
    <line x1="0" y1="26" x2="345" y2="26" stroke="#1e293b" stroke-width="0.8" />
    <text x="12" y="17" fill="#64748b" font-size="9.5" class="tech-mono" letter-spacing="1">SYSTEM GRAPH // MULTIMODAL PIPELINE</text>
    <circle cx="328" cy="14" r="3" fill="#38bdf8" />
    <circle cx="316" cy="14" r="3" fill="#6366f1" />
    <circle cx="304" cy="14" r="3" fill="#10b981" />

    <!-- Graph Nodes and Connectors -->
    <!-- Static Graph Topology Lines (Dim) -->
    <g stroke="#1e293b" stroke-width="1.2">
      <!-- Input to encoders -->
      <line x1="45" y1="65" x2="115" y2="50" />
      <line x1="45" y1="105" x2="115" y2="105" />
      <line x1="45" y1="145" x2="115" y2="155" />

      <!-- Encoders cross connect -->
      <line x1="115" y1="50" x2="115" y2="105" />
      <line x1="115" y1="105" x2="115" y2="155" />

      <!-- Encoders to Fusion Hub -->
      <line x1="115" y1="50" x2="195" y2="105" />
      <line x1="115" y1="105" x2="195" y2="105" />
      <line x1="115" y1="155" x2="195" y2="105" />

      <!-- Fusion to Calibrated Heads -->
      <line x1="195" y1="105" x2="275" y2="70" />
      <line x1="195" y1="105" x2="275" y2="140" />

      <!-- Cross link between heads -->
      <line x1="275" y1="70" x2="275" y2="140" />
    </g>

    <!-- Animated Dynamic Data Signal Paths -->
    <g fill="none">
      <line class="signal-line-1" x1="45" y1="65" x2="115" y2="50" stroke="#38bdf8" stroke-width="1.5" />
      <line class="signal-line-2" x1="45" y1="105" x2="115" y2="105" stroke="#a78bfa" stroke-width="1.5" />
      <line class="signal-line-3" x1="45" y1="145" x2="115" y2="155" stroke="#34d399" stroke-width="1.5" />

      <line class="signal-line-1" x1="115" y1="50" x2="195" y2="105" stroke="#38bdf8" stroke-width="1.8" />
      <line class="signal-line-3" x1="115" y1="105" x2="195" y2="105" stroke="#a78bfa" stroke-width="1.8" />
      <line class="signal-line-2" x1="115" y1="155" x2="195" y2="105" stroke="#34d399" stroke-width="1.8" />

      <line class="signal-line-1" x1="195" y1="105" x2="275" y2="70" stroke="#38bdf8" stroke-width="2" />
      <line class="signal-line-2" x1="195" y1="105" x2="275" y2="140" stroke="#f43f5e" stroke-width="2" />
    </g>

    <!-- Graph Nodes -->
    <!-- Input Sensory Layer -->
    <g transform="translate(45, 65)">
      <circle cx="0" cy="0" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
      <text x="-25" y="-10" fill="#64748b" font-size="8.5" class="tech-mono">AUDIO</text>
    </g>
    <g transform="translate(45, 105)">
      <circle cx="0" cy="0" r="7" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#a78bfa" />
      <text x="-25" y="-10" fill="#64748b" font-size="8.5" class="tech-mono">LYRIC</text>
    </g>
    <g transform="translate(45, 145)">
      <circle cx="0" cy="0" r="7" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#34d399" />
      <text x="-25" y="-10" fill="#64748b" font-size="8.5" class="tech-mono">IMAGE</text>
    </g>

    <!-- Intermediate Representations -->
    <g transform="translate(115, 50)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
      <text x="-12" y="-11" fill="#94a3b8" font-size="8.5" class="tech-mono">Z_aud</text>
    </g>
    <g transform="translate(115, 105)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#a78bfa" />
      <text x="-12" y="-11" fill="#94a3b8" font-size="8.5" class="tech-mono">Z_txt</text>
    </g>
    <g transform="translate(115, 155)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#34d399" />
      <text x="-12" y="-11" fill="#94a3b8" font-size="8.5" class="tech-mono">Z_vis</text>
    </g>

    <!-- Central Fusion Core (Pulsing) -->
    <g transform="translate(195, 105)">
      <circle class="expanding-ring" cx="0" cy="0" r="7" fill="none" stroke="#38bdf8" />
      <circle class="expanding-ring-delayed" cx="0" cy="0" r="7" fill="none" stroke="#a78bfa" />
      <circle cx="0" cy="0" r="14" fill="#091322" stroke="#38bdf8" stroke-width="2" />
      <circle class="pulse-node" cx="0" cy="0" r="6" fill="#38bdf8" />
      <text x="-26" y="24" fill="#38bdf8" font-size="9" font-weight="700" class="tech-mono">FUSION</text>
      <text x="-22" y="33" fill="#64748b" font-size="7.5" class="tech-mono">HUB (w)</text>
    </g>

    <!-- Inference and Calibration Outputs -->
    <g transform="translate(275, 70)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
      <text x="12" y="3" fill="#e2e8f0" font-size="8.5" class="tech-mono">P(y|X)</text>
      <text x="12" y="12" fill="#64748b" font-size="7.5" class="tech-mono">PRED</text>
    </g>
    <g transform="translate(275, 140)">
      <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3.5" fill="#f43f5e" />
      <text x="12" y="3" fill="#f43f5e" font-size="8.5" class="tech-mono">UNCERTAINTY</text>
      <text x="12" y="12" fill="#64748b" font-size="7.5" class="tech-mono">CALIB σ²</text>
    </g>

    <!-- Telemetry Readout Footer -->
    <g transform="translate(10, 182)">
      <text x="0" y="0" fill="#475569" font-size="8" class="tech-mono">MODALITY WEIGHTS: [A: 0.44 | T: 0.35 | V: 0.21]</text>
      <text x="215" y="0" fill="#10b981" font-size="8" class="tech-mono">LATENCY: 1.42ms</text>
    </g>
  </g>

  <!-- Bottom Technical Strip -->
  <g transform="translate(32, 260)">
    <text x="0" y="0" fill="#475569" font-size="9" class="tech-mono">SYSTEM_ID: PTANH-RESEARCH-NODE-01</text>
    <text x="240" y="0" fill="#475569" font-size="9" class="tech-mono">//</text>
    <text x="260" y="0" fill="#475569" font-size="9" class="tech-mono">ENGINE: TORCH-RELIABLE-ML</text>
    <text x="440" y="0" fill="#475569" font-size="9" class="tech-mono">//</text>
    <text x="460" y="0" fill="#475569" font-size="9" class="tech-mono">DECENTRALIZED ANCHORS: SUI &amp; APTOS</text>
    <text x="735" y="0" fill="#38bdf8" font-size="9" class="tech-mono">TELEMETRY REFRESH: OK</text>
  </g>
</svg>
